<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreamento Veicular</title>
  <link rel="stylesheet" href="estilo.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <!-- TELA DE LOGIN — SEM CRIAR CONTA AQUI -->
  <div id="tela-login" class="tela">
    <div class="caixa-login">
      <h1>🚗 Rastreamento Veicular</h1>
      
      <form id="form-entrar" class="form-visivel" onsubmit="event.preventDefault(); fazerLogin();">
        <h2>Entrar</h2>
        <input type="text" id="usuario" placeholder="Usuário" autocomplete="username" required>
        <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
        <p id="erro-login" class="erro"></p>
        <button type="submit">Entrar</button>
        <p class="info-tela-login">
          ⚠️ Apenas o Administrador pode criar contas e cadastrar veículos.
        </p>
      </form>
    </div>
  </div>

  <!-- TELA PRINCIPAL -->
  <div id="tela-principal" class="tela tela-escondida">
    <header class="cabecalho">
      <div>
        <h1>🚗 Painel de Rastreamento</h1>
        <p id="nome-usuario-logado"></p>
      </div>
      <button onclick="sair()" class="btn-sair">Sair</button>
    </header>
    <div class="conteudo">
      <aside class="barra-lateral">
        <button onclick="abrirGerenciador()" id="btn-gerenciar" class="btn-gerenciar" style="display:none;">
          ⚙️ Gerenciar Sistema
        </button>
        
        <h3>Meus Veículos</h3>
        <div id="lista-veiculos"></div>
        <p id="ultima-atualizacao" class="info-versao"></p>
      </aside>
      
      <main class="area-mapa">
        <div class="botoes-mapa">
          <button id="btnRuas" onclick="trocarMapa('ruas')">🗺️ Ruas</button>
          <button id="btnSat" onclick="trocarMapa('satellite')">🛰️ Satélite</button>
        </div>
        <div id="mapa"></div>
      </main>
    </div>
  </div>

  <!-- MODAL DE GERENCIAMENTO — TUDO AQUI DENTRO -->
  <div id="modal-gerenciar" class="modal">
    <div class="modal-conteudo" style="max-width:620px;">
      <span class="fechar" onclick="fecharGerenciador()">&times;</span>
      <h2>👑 Painel de Controle</h2>
      
      <!-- 🧑‍🤝‍🧑 CRIAR USUÁRIO -->
      <div style="border-bottom:2px solid #eee; padding-bottom:1.2rem; margin-bottom:1.2rem;">
        <h3>➕ Criar Novo Usuário</h3>
        <input type="text" id="novo-usuario" placeholder="Nome do usuário">
        <input type="password" id="nova-senha" placeholder="Senha (mín. 4 caracteres)">
        <input type="password" id="confirma-senha" placeholder="Repetir senha">
        <p id="erro-cadastro" class="erro"></p>
        <button type="button" onclick="criarConta()">✅ Criar Conta</button>
      </div>
      
      <!-- 🚙 CADASTRAR VEÍCULO -->
      <div style="border-bottom:2px solid #eee; padding-bottom:1.2rem; margin-bottom:1.2rem;">
        <h3>🚙 Adicionar Veículo</h3>
        <input type="text" id="campo-nome" placeholder="Nome / Modelo">
        <input type="text" id="campo-placa" placeholder="Placa">
        <input type="text" id="campo-cor" placeholder="Cor / Observação">
        <input type="text" id="campo-usuario-dono" placeholder="Usuário DONO deste veículo" style="border-color:#28a745;">
        <button type="button" onclick="salvarVeiculo()">💾 Salvar Veículo</button>
      </div>
      
      <!-- 👤 TODOS OS USUÁRIOS -->
      <h3>👤 Usuários Cadastrados</h3>
      <div id="lista-todos-usuarios" style="margin-bottom:1.2rem;"></div>
      
      <!-- 🚘 TODOS OS VEÍCULOS -->
      <h3>🚘 Todos os Veículos</h3>
      <div id="lista-todos-veiculos"></div>
    </div>
  </div>

  <script src="codigo.js?v=6.0"></script>
</body>
</html>
