<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreamento Veículos</title>
  <link rel="stylesheet" href="estilo.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="tela-login" class="tela">
  <div class="caixa-login">
    <h1>🚗 Rastreamento Veículos</h1>
    
    <form id="form-entrar" class="form-visivel">
      <h2>Entrar</h2>
      <input type="text" id="usuario" placeholder="Usuário" autocomplete="username">
      <input type="password" id="senha" placeholder="Senha" autocomplete="current-password">
      <p id="erro-login" class="erro"></p>
      <button type="button" onclick="fazerLogin()">Entrar</button>
      <p class="troca-form">Não tem conta? <a href="#" onclick="mostrarCadastro(event)">Criar conta</a></p>
    </form>

    <form id="form-cadastro" class="form-escondido">
      <h2>Criar Conta</h2>
      <input type="text" id="novo-usuario" placeholder="Novo usuário" autocomplete="username">
      <input type="password" id="nova-senha" placeholder="Senha" autocomplete="new-password">
      <input type="password" id="confirma-senha" placeholder="Repetir senha" autocomplete="new-password">
      <p id="erro-cadastro" class="erro"></p>
      <button type="button" onclick="criarConta()">Criar conta</button>
      <p class="troca-form">Já tem conta? <a href="#" onclick="mostrarLogin(event)">Entrar</a></p>
    </form>
  </div>
</div>

<!-- TELA PRINCIPAL -->
<div id="tela-principal" class="tela tela-escondida">
  <header class="cabecalho">
    <div>
      <h1>🚗 Rastreamento Veículos</h1>
      <p id="nome-usuario-logado"></p>
    </div>
    <button onclick="sair()" class="btn-sair">Sair</button>
  </header>

  <div class="conteudo">
    <aside class="barra-lateral">
      <button onclick="abrirGerenciador()" class="btn-gerenciar">➕ Gerenciar Veículos</button>
      
      <h3>Meus Veículos</h3>
      <div id="lista-veiculos"></div>
      
      <p id="ultima-atualizacao" class="info-versao"></p>
    </aside>

    <main class="area-mapa">
      <div class="botoes-mapa">
        <button id="btnRuas" onclick="trocarMapa('ruas')">🗺️ Ruas</button>
        <button id="btnSat" onclick="trocarMapa('satellite')">🛰️ Satélite</button>
      </div>
      <div id="mapa"></div>
    </main>
  </div>
</div>

<!-- MODAL GERENCIAR -->
<div id="modal-gerenciar" class="modal">
  <div class="modal-conteudo">
    <span class="fechar" onclick="fecharGerenciador()">&times;</span>
    <h2>Gerenciar Veículos</h2>
    
    <div class="cadastro-veiculo">
      <h3>Adicionar Veículo</h3>
      <input type="text" id="campo-nome" placeholder="Nome / Modelo">
      <input type="text" id="campo-placa" placeholder="Placa (ex: ABC1234)">
      <input type="text" id="campo-cor" placeholder="Cor / Observação">
      <button onclick="salvarVeiculo()">💾 Salvar Veículo</button>
    </div>

    <h3>Veículos Cadastrados</h3>
    <div id="lista-cadastro"></div>
  </div>
</div>

<script src="codigo.js"></script>
</body>
</html>
